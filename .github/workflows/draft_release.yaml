---
name: Draft a Release
'on':
  push:
    branches:
      - main

jobs:

  draft_release:
    name: Draft a Release
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
